name: CT Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Weekly run

jobs:
  continuous-training:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull Data via DVC
        run: |
          # If using local storage simulation in runner or remote DVC store
          python -m dvc pull || echo "Skipping dvc remote pull, using local tracked stub"

      - name: Execute Training Script
        run: |
          python src/train.py