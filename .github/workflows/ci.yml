name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create sample dataset for testing
        run: |
          mkdir -p data
          echo "MedInc,HouseAge,AveRooms,AveBedrms,Population,AveOccup,Latitude,Longitude,MedHouseVal" > data/housing.csv
          echo "8.3252,41,6.984126,1.02381,322,2.555556,37.88,-122.23,4.526" >> data/housing.csv

      - name: Run Unit Tests with Pytest
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/ -v